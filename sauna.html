<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Longevity — Pricing has moved</title>
<!-- pricing.houselongevity.com retired 2026-06-28 — consolidated into the main House Longevity site.
     Canonical customer pricing now lives at houselongevity.com/pricing.html. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://houselongevity.com/pricing.html">
<meta http-equiv="refresh" content="0; url=https://houselongevity.com/pricing.html">
<style>
  :root { --bg:#f6f1ea; --surface:#fff; --text:#2a1f17; --dim:#6b5d4f; --border:#e6dccb; --accent:#8b5a3c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text);
         font-family:'Newsreader',Iowan,Charter,Georgia,serif; padding:24px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:16px;
          padding:40px 36px; max-width:460px; text-align:center;
          box-shadow:0 8px 30px rgba(139,90,60,0.07); }
  h1 { font-size:1.4rem; font-weight:600; margin:0 0 10px; }
  p { color:var(--dim); line-height:1.55; margin:0 0 22px; font-size:1rem; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
          padding:12px 22px; border-radius:12px; font-weight:600; }
  a.btn:hover { opacity:0.92; }
</style>
</head>
<body>
  <div class="card">
    <h1>Our pricing has moved</h1>
    <p>House Longevity rates &amp; packages now live on our main site. You'll be redirected automatically.</p>
    <a class="btn" href="https://houselongevity.com/pricing.html">Continue to House Longevity pricing</a>
  </div>
  <script>location.replace("https://houselongevity.com/pricing.html");</script>
</body>
</html>
